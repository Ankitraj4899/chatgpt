<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/brand-openai.svg">
    <title>ChatGPT</title>
    <link rel="stylesheet" href="scss/style.css">
</head>

<body>

    <div class="chatgpt">

        <div class="chatgpt__sidebar-overlay"></div>

        <div class="chatgpt__sidebar">

            <div class="chatgpt__sidebar--nav icon">

                <div>
                    <p class="chat-logo">ChatGPT</p>
                </div>

                <div>
                    <button class="search--icon icon" type="button" aria-label="Search chats">
                        <img src="assets/search.svg" alt="" class="search-icon icon">
                    </button>

                    <button class="collapse--btn icon" type="button" aria-label="Collapse sidebar">
                        <img src="assets/layout-sidebar.svg" alt="" class="sidebar-icon icon">
                    </button>
                </div>

            </div>

            <div class="chatgpt__sidebar--search">

                <button class="sidebar-search-back icon" type="button" aria-label="Close search">
                    <img src="assets/arrow-left.svg" alt="">
                </button>

                <div class="sidebar-search-box">

                    <img src="assets/search.svg" alt="">

                    <input type="text" class="sidebar-search-input" placeholder="Search chats" autocomplete="off">

                    <button class="sidebar-search-clear icon" type="button" aria-label="Clear search">
                        <img src="assets/close.svg" alt="">
                    </button>

                </div>

            </div>

            <div class="chatgpt__middle icon">

                <div class="chatgpt__sidebar--top">

                    <div class="chat">
                        <a href="index.html">
                            <img src="assets/chat.svg" alt="">
                        </a>
                        <p>New chat</p>
                    </div>

                    <div class="chat">
                        <a href="">
                            <img src="assets/images.svg" alt="">
                        </a>
                        <p>Images</p>
                    </div>

                    <div class="chat">
                        <a href="">
                            <img src="assets/library.svg" alt="">
                        </a>
                        <p>Library</p>
                    </div>

                    <div class="chat">
                        <a href="">
                            <img src="assets/plugins.svg" alt="">
                        </a>
                        <p>Plugins</p>
                    </div>

                    <div class="chat">
                        <a href="">
                            <img src="assets/projects.svg" alt="">
                        </a>
                        <p>Projects</p>
                    </div>

                </div>

                <div class="chatgpt__sidebar--bottom">
                    <div class="chat-history"></div>
                </div>

            </div>

            <div class="chatgpt__sidebar--footer icon">

                <div>
                    <img src="assets/user.svg" alt="">
                    <p class="icon">Ankit</p>
                </div>

                <button class="offer--btn">
                    <img src="assets/offer.svg" alt="">
                    Claim offer
                </button>

            </div>

        </div>

        <div class="chatgpt__content">

            <div class="chatgpt__content--top">

                <button class="mobile-menu-btn icon">
                    <img src="assets/menu.svg" alt="">
                </button>

                <button class="offer--btn">
                    <img src="assets/offer.svg" alt="">
                    <span>Free offer</span>
                </button>

                <button class="toggle-theme icon">
                    <img src="assets/theme-light-dark.svg" alt="">
                </button>

                <button class="chat-icon icon">
                    <img src="assets/chat-icon.svg" alt="">
                </button>

            </div>

            <main class="chatgpt__content--middle">

                <h1 class="icon">Ready when you are...</h1>

                <div class="chatgpt__messages"></div>

                <div class="chatgpt__suggestions">

                    <button class="suggestion icon">
                        <img src="assets/image.svg" alt="">
                        <span class="icon">
                            <a href="" target="_blank">Create an image</a>
                        </span>
                    </button>

                    <button class="suggestion icon">
                        <img src="assets/pencil.svg" alt="">
                        <span class="icon">
                            <a href="" target="_blank">Write or edit</a>
                        </span>
                    </button>

                    <button class="suggestion icon">
                        <img src="assets/globe.svg" alt="">
                        <span class="icon">
                            <a href="https://www.google.com/" target="_blank">
                                Search the web
                            </a>
                        </span>
                    </button>

                </div>

            </main>

            <div class="chatgpt__content--bottom">

                <div class="chatgpt__search">

                    <button class="search__add">
                        <img src="assets/plus.svg" alt="">
                    </button>

                    <input class="search__input" type="text" placeholder="Ask anything">

                    <div class="search__actions">

                        <button class="search__think">
                            <img src="assets/think.svg" alt="">
                            <span>Think</span>
                        </button>

                        <button class="search__mic">
                            <img src="assets/microphone.svg" alt="">
                        </button>

                        <button class="search__voice">
                            <img src="assets/voice.svg" alt="">
                        </button>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <script src="js/conversations.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/mock.js"></script>

</body>

</html>
